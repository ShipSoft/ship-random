name: clang-tidy
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: clang-tidy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  clang-tidy:
    permissions:
      contents: read
      pull-requests: write
    uses: ShipSoft/.github/.github/workflows/clang-tidy.yml@main
